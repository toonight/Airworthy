# Synthetic configuration shaped like an agent CLI config.toml (test fixture, not a real setup).
model = "example-model"
approval_policy = "on-request"
sandbox_mode = "workspace-write"
max_turns = 25
temperature = 0.2
hide_reasoning = false
updated = 2026-01-15T09:30:00Z

[sandbox_workspace_write]
network_access = false
writable_roots = [
  'C:\Example\cache',   # literal string: no escapes
  "/tmp/example",
]

[shell_environment_policy]
inherit = "core"
exclude = ["AWS_*", "AZURE_*"]
set = { EXAMPLE_FLAG = "1" }

[mcp_servers.docs]
command = "docs-server"
args = ["--stdio", "--root", "."]
env = { DOCS_TOKEN = "FAKE-TOKEN-NOT-A-SECRET" }
startup_timeout_sec = 20

[mcp_servers."remote.example"]
url = "https://mcp.example.invalid/mcp"
enabled = false

[mcp_servers.docs.tools.search]
approval_mode = "prompt"

[profiles.review]
model = "example-model-mini"
approval_policy = "untrusted"

[projects.'C:\Example\repo']
trust_level = "trusted"

[projects."/home/example/project"]
trust_level = "untrusted"
