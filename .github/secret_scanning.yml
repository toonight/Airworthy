# Secret scanning configuration. Format and behavior:
# https://docs.github.com/en/code-security/how-tos/secure-your-secrets/customize-leak-detection/excluding-folders-and-files-from-secret-scanning
#
# Airworthy has rules that detect secrets in agent configuration files, and the tests of these
# rules need token-shaped strings. The paths below contain only intentionally FAKE tokens
# (marked FAKE, for example "ghp_FAKE..."): none of them is a real credential. Alerts found in
# these paths are closed as "ignored by configuration".
#
# Keep this list short: everything else in the repository is still scanned, including examples/,
# whose reports show secrets masked only (a full token there would be a masking bug).
paths-ignore:
  - "tests/fixtures/**"
